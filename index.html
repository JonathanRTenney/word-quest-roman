        catch(e){ vmsg.className = 'status no'; vmsg.textContent = e && e.message === 'nodecomp' ? 'This browser cannot read the code.' : 'That does not look like a Word Quest report.'; }
      }, {id:'btnView'}), vmsg)));
  wrap.append(h('p', {class:'foot'}, 'Word Quest ' + (META.version || '') + ' · Firat Education'));
  main.append(wrap);
  return ready;
}
async function openView(text){
  const st = await C.readCode(text);
  save();          // keep her own progress safe before switching
  viewing = st;
  viewK = C.numDay(st.__at) || K();
  timerOff();
  const b = $('#viewBanner'); b.hidden = false; b.innerHTML = '';
  b.append(h('span', {class:'grow'}, h('b', null, 'Viewing a report'), ' from ' + (st.__made ? new Date(st.__made).toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'}) : fmtDay(viewK)) + '. Nothing is saved.'),
    btn('line', 'Close', closeView, {id:'btnCloseView'}));
  show('send');
}
function closeView(){
  viewing = null; viewK = null;
  const b = $('#viewBanner'); b.hidden = true; b.innerHTML = '';
  show(state.welcomed ? 'home' : 'welcome');
}

/* ============ Settings ============ */
function segSetting(id, label, val, opts, on, hint){
  const seg = h('div', {class:'seg', role:'group', 'aria-labelledby': id + 'L', id});
  opts.forEach(([v, t]) => seg.append(h('button', {type:'button', 'aria-pressed': String(String(v) === String(val)), 'data-v': String(v), onclick: () => {
    seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === String(v))));
    on(v); save();
  }}, t)));
  return h('div', {class:'field'}, h('span', {class:'flabel', id: id + 'L'}, label), seg, hint ? h('span', {class:'hint'}, hint) : null);
}
function viewSettings(main){
  if(viewing){ show('send'); return; }
  const s = state.settings, k = K();
  const td = h('input', {type:'date', id:'setTest', value: s.testDate || '', min: k});
  td.addEventListener('change', () => { s.testDate = td.value || null; C.applyTestDate(state, K()); save(); tdMsg.textContent = s.testDate ? 'Saved.' : 'No test date.'; });
  const tdMsg = h('p', {class:'status', 'aria-live':'polite'});
  const reset = h('input', {id:'resetIn', autocapitalize:'characters', autocomplete:'off', autocorrect:'off', spellcheck:'false', placeholder:'RESET'});
  const resetMsg = h('p', {class:'status', 'aria-live':'polite'});
  const wrap = h('div', {class:'stack fade-in'},
    h('div', {class:'card stack'},
      segSetting('setGoal', 'Nightly goal', s.goal, [[10, '10 minutes'], [15, '15 minutes']], v => { s.goal = Number(v); }),
      segSetting('setNew', 'New words a night', s.newMode, [['auto', 'Automatic'], [2, '2'], [3, '3'], [4, '4'], [5, '5']], v => { s.newMode = v === 'auto' ? 'auto' : Number(v); },
        'Automatic gives fewer new words when many reviews are waiting.'),
      voiceOK ? h('div', {class:'stack tight'},
        segSetting('setRate', 'Voice speed', s.rate, [[0.75, 'Slow'], [0.9, 'Normal'], [1, 'Fast']], v => { s.rate = Number(v); }),
        btn('line', 'Test the voice', () => speak('deft. With a deft move, she dodged the attack.'))) : h('p', {class:'muted small'}, 'This browser cannot read words aloud.'),
      segSetting('setTheme', 'Theme', s.theme, [['auto', 'Auto'], ['dark', 'Dark'], ['light', 'Light']], v => { s.theme = v; applyTheme(); }, 'Auto follows your phone.')),
    h('div', {class:'card stack tight'},
      h('div', {class:'field'}, h('label', {for:'setTest'}, 'Test date'), td, h('span', {class:'hint'}, 'Jonathan can set this for you.')),
      s.testDate ? btn('link', 'Clear the test date', () => { s.testDate = null; C.applyTestDate(state, K()); save(); show('settings'); }, {id:'btnClearTest'}) : null,
      tdMsg),
    h('div', {class:'card stack tight'},
      h('div', {class:'lbl'}, 'Start over'),
      h('p', {class:'small'}, 'Erases all progress on this device. Copy your report under Send first.'),
      h('div', {class:'field'}, h('label', {for:'resetIn'}, 'Type RESET to confirm'), reset),
      btn('line', 'Erase my progress', () => {
        if(reset.value.trim() !== 'RESET'){ resetMsg.className = 'status no'; resetMsg.textContent = 'Type RESET in the box first.'; reset.focus(); return; }
        const old = lsGet(KEY); if(old) lsSet(BEFORE_RESET, old);
        const theme = state.settings.theme;
        state = C.freshState(now().toISOString()); state.welcomed = true; state.settings.theme = theme;
        live = null; save(); show('home');
      }, {id:'btnReset'}), resetMsg),
    h('p', {class:'muted tiny center'}, 'Word list version ' + (META.version || 'dev') + ' · ' + C.BANK.length + ' words' + (META.built ? ' · built ' + META.built : '')),
    btn('ghost block', 'Done', () => show('home'), {id:'btnSettingsDone'}));
  main.append(wrap);
}

/* ============ navigation ============ */
let tab = 'home';
const TITLES = {home:'Word Quest', words:'Words', progress:'Progress', send:'Send', settings:'Settings', welcome:'Word Quest', speed:'Speed round', session:'Tonight'};
const views = {home:viewHome, session:viewSession, words:viewWords, progress:viewProgress, send:viewSend, speed:viewSpeed, settings:viewSettings, welcome:viewWelcome};
function setNav(){
  const map = {home:['Tonight', ICON.moon], words:['Words', ICON.book], progress:['Progress', ICON.chart], send:['Send', ICON.send]};
  for(const t in map){
    const b = document.querySelector('[data-tab="' + t + '"]');
    b.innerHTML = map[t][1] + '<span>' + map[t][0] + '</span>';
    if(tab === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    b.onclick = () => show(t);
  }
}
let showing = false, pendingShow = null;
function show(name){
  if(!views[name]) name = 'home';
  if(showing){ pendingShow = name; return; }      // a view asked for another view while rendering
  showing = true;
  try{
    if(name !== 'speed' && speed && !speed.over){ clearInterval(speed.iv); speed = null; }
    closeSheet();
    tab = name;
    const main = $('#main'); main.innerHTML = '';
    if(name !== 'session') cur = null;
    if((name === 'session' || name === 'speed') && !viewing) timerOn(); else timerOff();
    const noNav = name === 'welcome' || name === 'session' || name === 'speed';
    document.getElementById('nav').hidden = noNav;
    document.body.classList.toggle('nonav', noNav);
    document.body.classList.toggle('nohead', name === 'session');
    $('#title').textContent = TITLES[name] || 'Word Quest';
    $('#btnSettings').hidden = !(name === 'home' && !viewing);
    views[name](main);
    setNav();
  } finally { showing = false; }
  if(pendingShow){ const p = pendingShow; pendingShow = null; show(p); return; }
  window.scrollTo(0, 0);
}

/* ============ keyboard ============ */
document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape' && document.querySelector('.modal')){ closeSheet(); return; }
  if(tab !== 'session' && tab !== 'speed') return;
  if(ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const ae = document.activeElement, typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
  if(ev.key === 'Enter' && !typing){
    if(ae && ae.tagName === 'BUTTON') return;      // the focused button handles Enter itself
    const nb = $('#btnNext') || $('#btnGotIt') || $('#btnRead') || $('#btnLesson');
    if(nb){ ev.preventDefault(); nb.click(); }
    return;
  }
  if(!typing && /^[1-4a-dA-D]$/.test(ev.key)){
    const i = /[1-4]/.test(ev.key) ? Number(ev.key) - 1 : 'abcd'.indexOf(ev.key.toLowerCase());
    const cs = [...document.querySelectorAll('#qArea .choice')].filter(x => !x.disabled);
    if(cs.length && cs.length === document.querySelectorAll('#qArea .choice').length && cs[i]){ ev.preventDefault(); cs[i].click(); }
  }
});

/* ============ start ============ */
document.getElementById('btnSettings').innerHTML = ICON.gear;
document.getElementById('btnSettings').onclick = () => { if(!viewing) show('settings'); };
document.getElementById('storageWarn').hidden = storageOK;
applyTheme();
try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); }catch(e){}
if(voiceOK){ try{ window.speechSynthesis.getVoices(); window.speechSynthesis.addEventListener('voiceschanged', () => {}); }catch(e){} }
window.addEventListener('pointerdown', function once(){
  window.removeEventListener('pointerdown', once);
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); }catch(e){}
});
if(!TESTING && location.protocol === 'https:' && 'serviceWorker' in navigator){
  try{ navigator.serviceWorker.register('sw.js').catch(() => {}); }catch(e){}
}
show(state.welcomed ? 'home' : 'welcome');

window.__WQ = {
  get state(){ return state; },
  set state(v){ state = C.normalize(v); live = C.sessionOpen(state, K()) ? state.session : null; },
  core: C, save, show, startNight, k: () => K(),
  get session(){ return live; },
  get current(){ return cur && live ? {item: live.q[live.pos], answer: cur.answer, phase: cur.phase || null, pos: live.pos} : (cur && tab === 'speed' ? {item: cur.item, answer: cur.answer} : null); },
  get tab(){ return tab; },
  get viewing(){ return viewing; }
};
})();

</script>
